# 

# Server Configuration
server.port=8081
spring.application.name=flight-service

# MySQL Database SEULEMENT
spring.datasource.url=jdbc:mysql://localhost:3306/aerosmart_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration POUR MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.com.aerosmart.flight=DEBUG