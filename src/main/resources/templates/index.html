<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aero Smart - Connexion Admin</title>
    <link rel="stylesheet" href="../shared-static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <h1>Aero Smart</h1>
            <p>Votre compagnie aérienne de confiance pour des voyages sécurisés</p>
        </div>

        <div class="login-tabs">
            <button class="tab active" onclick="switchTab('login')">Se Connecter</button>
            <button class="tab" onclick="switchTab('register')">S'inscrire</button>
        </div>

        <div class="login-form" id="loginForm">
            <h2>Connexion</h2>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" placeholder="Votre nom d'utilisateur" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
                </div>

                <div class="form-options">
                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-primary">Se Connecter</button>
            </form>

            <p class="switch-form">Pas de compte ? <a href="#" onclick="switchTab('register')">S'inscrire</a></p>
        </div>

        <div class="login-form hidden" id="registerForm">
            <h2>Inscription</h2>
            <form id="adminRegisterForm">
                <div class="form-group">
                    <label for="regUsername">Nom d'utilisateur</label>
                    <input type="text" id="regUsername" name="username" placeholder="Choisissez un nom d'utilisateur" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" id="email" name="email" placeholder="Votre adresse email" required>
                </div>

                <div class="form-group">
                    <label for="regPassword">Mot de passe</label>
                    <input type="password" id="regPassword" name="password" placeholder="Créez un mot de passe" required>
                </div>

                <button type="submit" class="btn-primary">S'inscrire</button>
            </form>

            <p class="switch-form">Déjà un compte ? <a href="#" onclick="switchTab('login')">Se connecter</a></p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
