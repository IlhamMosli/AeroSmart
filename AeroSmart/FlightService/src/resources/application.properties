cat > flight-service/src/main/resources/application.properties << 'EOF'
# Server Configuration
server.port=8080
spring.application.name=flight-service

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Static Resources (inclut les assets partagés)
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,http://localhost:8085/

# Database (H2 pour le développement)
spring.datasource.url=jdbc:h2:mem:flightdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Services URLs
app.booking-service.url=http://localhost:5000
app.weather-service.url=http://localhost:5001
app.passenger-service.url=http://localhost:8081

# Logging
logging.level.com.aerosmart.flight=DEBUG
EOF